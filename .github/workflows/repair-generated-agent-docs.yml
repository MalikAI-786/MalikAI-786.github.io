name: Repair generated agent docs

on:
  push:
    branches:
      - chatgpt/repair-generated-agent-docs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/repair-generated-agent-docs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch generator source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/brand/make_readmes.py')
          s = p.read_text()

          old = """This is the canonical surface. Everything else on my GitHub either feeds it or\npoints back at it.\n"""
          new = """> **Agent operating map:** [`.claude/SKILL-MAP.md`](.claude/SKILL-MAP.md) — the\n> one-page router that tells future agents which specialist skill to auto-consult\n> for legal work, design, career documents, Mīzān, Roohe Iqbal, source ingestion\n> and repository governance.\n\nThis is the canonical surface. Everything else on my GitHub either feeds it or\npoints back at it.\n"""
          if old not in s:
              raise SystemExit('site README insertion point not found')
          s = s.replace(old, new, 1)

          old = '''def render_claude_md(repo):\n    """Claude Code reads CLAUDE.md. Keep one document, not two."""\n    return (f"# {repo}\\n\\n"\n            "Instructions for this repository live in **[AGENTS.md](AGENTS.md)**. "\n            "Read it before making changes.\\n\\n"\n            f"Start with the control center: **[Malik Operating System]({CONTROL})** "\n            "— git is the published record, Notion is the live state.\\n")\n'''
          new = '''def render_claude_md(repo):\n    """Claude Code reads CLAUDE.md. Keep one document, not two."""\n    skill_map = ""\n    if repo == "MalikAI-786.github.io":\n        skill_map = (\n            "Before substantive work, read **[.claude/SKILL-MAP.md](.claude/SKILL-MAP.md)** "\n            "and load the matching specialist skill(s). Claude Code discovers executable "\n            "skills from `.claude/skills/<name>/SKILL.md`; do not rely on flat skill files "\n            "or chat memory.\\n\\n"\n        )\n    return (f"# {repo}\\n\\n"\n            "Instructions for this repository live in **[AGENTS.md](AGENTS.md)**. "\n            "Read it before making changes.\\n\\n"\n            + skill_map +\n            f"Start with the control center: **[Malik Operating System]({CONTROL})** "\n            "— git is the published record, Notion is the live state.\\n")\n'''
          if old not in s:
              raise SystemExit('render_claude_md insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Regenerate and validate
        run: |
          python assets/brand/make_readmes.py
          cp build/readmes/MalikAI-786.github.io/README.md README.md
          cp build/readmes/MalikAI-786.github.io/CLAUDE.md CLAUDE.md
          python tools/audit/invariants.py
      - name: Commit repaired source and generated outputs
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add assets/brand/make_readmes.py README.md CLAUDE.md
          if git diff --cached --quiet; then
            echo 'No repair commit needed.'
            exit 0
          fi
          git commit -m 'Generate skill routing from canonical README source'
          git push origin HEAD:chatgpt/repair-generated-agent-docs
