name: invariants

# Authoritative repository gate. Pull requests are checked before merge and
# main is checked after merge. This avoids duplicate branch-push + PR runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step on purpose. tools/audit/invariants.py and the
      # generator it runs are standard library only, so this job stays fast and
      # cannot break because a dependency moved.
      - name: Check repository invariants
        run: python3 tools/audit/invariants.py
