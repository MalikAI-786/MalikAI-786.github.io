name: invariants

# The authoritative gate. The pre-commit hook is convenience and can be skipped
# with --no-verify; this runs on what was actually pushed and cannot be.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step on purpose. tools/audit/invariants.py and the
      # generator it runs are standard library only, so this job stays fast and
      # cannot break because a dependency moved.
      - name: Check repository invariants
        run: python3 tools/audit/invariants.py
