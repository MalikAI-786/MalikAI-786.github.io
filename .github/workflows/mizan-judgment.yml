name: mizan-judgment

on:
  pull_request:
    paths:
      - 'mizan/**'
      - 'assets/brand/tokens.css'
      - '.claude/skills/mizan/scripts/**'
      - '.github/workflows/mizan-judgment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Judgment worksheet interactions and privacy
        run: node .claude/skills/mizan/scripts/judgment-smoke.js
      - name: Existing Mizan regression suite
        run: node .claude/skills/mizan/scripts/smoke.js
